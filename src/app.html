<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<script>
			try {
				var t = localStorage.getItem('theme');
				if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
			} catch (e) {}
		</script>
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#171b22" media="(prefers-color-scheme: dark)" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="openski.org" />
		<title>OpenSki · Ski maps powered by OpenStreetMap</title>
		<meta
			name="description"
			content="Explore free offline piste maps for about 3,900 ski areas and help improve OpenStreetMap. Plan ski and snowboard routes, check snow conditions and see lift queues where available."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="openski.org" />
		<meta property="og:url" content="https://openski.org/" />
		<meta property="og:title" content="OpenSki · Ski maps powered by OpenStreetMap" />
		<meta
			property="og:description"
			content="Explore free offline piste maps for about 3,900 ski areas and help improve OpenStreetMap. Plan ski and snowboard routes, check snow conditions and see lift queues where available."
		/>
		<meta property="og:image" content="https://openski.org/og-apartment.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="An OpenSki illustration of a skier studying a piste map that unfolds through an apartment window into the Alps."
		/>
		<meta name="twitter:card" content="summary_large_image" />
		<link rel="canonical" href="https://openski.org/" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/icons/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
